<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Management System</title>
<style>

  * {
    margin: 0; 
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #5e6a84, #4b5a7a );
    padding: 30px 20px;
    color: #2f3746;
  }

  .container {
    max-width: 1100px;
    margin: auto;
  }

  header {
    background: white;
    padding: 30px 15px; 
    border-radius: 20px;
    text-align: center;
    margin-bottom: 30px;

  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  header p {
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 20px;
    color: #424c60;
  }

  header button {
    background-color: #f93f4c; 
    border: none;
    border-radius: 15px;
    padding: 12px 24px;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  header button:hover {
    background-color: #f3101b;
  }

  
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }

  .stats > div {
    flex: 1;
    background: white;
    border-radius: 20px;
    padding: 20px 0;
    text-align: center;
  }

  .stats h3 {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 10px;
    color: #2f3746;
  }

  .stats p {
    font-size: 24px;
    font-weight: 700;
    color: #3763cc; 
  }


  .forms {
    display: flex;
    gap: 20px;
    margin-bottom: 35px;
  }

  .form-card {
    flex: 1;
    background: white;
    border-radius: 20px;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
  }

  .form-card h2 {
    margin-bottom: 12px;
    font-weight: 700;
    color: #2f3746;
  }

  .form-card input {
    padding: 12px 15px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    background-color: rgb(222, 227, 231);
  }

  .form-card button {
    background-color: #fc8459;
    border: none;
    border-radius: 12px;
    padding: 12px 0;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .form-card button:hover {
    background-color: #f9663f;
  }


  .lists {
    display: flex;
    gap: 20px;
  }

  .list-card {
    flex: 1;
    background: white;
    border-radius: 20px;
    padding: 20px 15px;
  }

  .list-card h2 {
    font-weight: 700;
    margin-bottom: 15px;
    color: #2f3746;
  }

  ul {
    list-style: none;
  }

  ul li {
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-weight: 600;
    color: #504a4a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  ul li button {
    background-color: #ec5e68;
    border: none;
    border-radius: 12px;
    color: white;
    padding: 6px 14px;
    cursor: pointer;
    font-weight: 700;
    transition: background-color 0.3s ease;
  }

  ul li button:hover {
    background-color: #d84a51;
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>School Management System</h1>
    <p>Simple, colorful, and beginner-friendly</p>
    <button onclick="clearAll()">Clear All Data</button>
  </header>

  <section class="stats">
    <div>
      <h3>Total Students</h3>
      <p id="totalStudents">0</p>
    </div>
    <div>
      <h3>Total Teachers</h3>
      <p id="totalTeachers">0</p>
    </div>
    <div>
      <h3>Total Classes</h3>
      <p id="totalClasses">0</p>
    </div>
  </section>

  <section class="forms">

    <div class="form-card">
      <h2>Add Student</h2>
      <input type="text" id="studentName" placeholder="Student name" />
      <input type="text" id="studentGrade" placeholder="Grade (Example: 7A)" />
      <button onclick="addStudent()">Add Student</button>
    </div>

    <div class="form-card">
      <h2>Add Teacher</h2>
      <input type="text" id="teacherName" placeholder="Teacher name" />
      <input type="text" id="teacherSubject" placeholder="Subject (Example: Math)" />
      <button onclick="addTeacher()">Add Teacher</button>
    </div>

    <div class="form-card">
      <h2>Add Class</h2>
      <input type="text" id="className" placeholder="Class name" />
      <input type="text" id="classRoom" placeholder="Room (Example: 102)" />
      <button onclick="addClass()">Add Class</button>
    </div>

  </section>

  <section class="lists">

    <div class="list-card">
      <h2>Students</h2>
      <ul id="studentsList"></ul>
    </div>

    <div class="list-card">
      <h2>Teachers</h2>
      <ul id="teachersList"></ul>
    </div>

    <div class="list-card">
      <h2>Classes</h2>
      <ul id="classesList"></ul>
    </div>

  </section>

</div>

<script>
  let students = [];
  let teachers = [];
  let classes = [];

  function updateCounts() {
    document.getElementById("totalStudents").textContent = students.length;
    document.getElementById("totalTeachers").textContent = teachers.length;
    document.getElementById("totalClasses").textContent = classes.length;
  }

  function renderLists() {
    const studentsList = document.getElementById("studentsList");
    const teachersList = document.getElementById("teachersList");
    const classesList = document.getElementById("classesList");

    studentsList.innerHTML = "";
    teachersList.innerHTML = "";
    classesList.innerHTML = "";

    students.forEach((s, i) => {
      studentsList.innerHTML += `
        <li>
          ${s.name} - ${s.grade}
          <button onclick="deleteStudent(${i})">Delete</button>
        </li>`;
    });

    teachers.forEach((t, i) => {
      teachersList.innerHTML += `
        <li>
          ${t.name} - ${t.subject}
          <button onclick="deleteTeacher(${i})">Delete</button>
        </li>`;
    });

    classes.forEach((c, i) => {
      classesList.innerHTML += `
        <li>
          ${c.name} - Room ${c.room}
          <button onclick="deleteClass(${i})">Delete</button>
        </li>`;
    });

    updateCounts();
  }

  function addStudent() {
    const name = document.getElementById("studentName").value.trim();
    const grade = document.getElementById("studentGrade").value.trim();
    if (name && grade) {
      students.push({ name, grade });
      renderLists();
      document.getElementById("studentName").value = "";
      document.getElementById("studentGrade").value = "";
    }
  }

  function addTeacher() {
    const name = document.getElementById("teacherName").value.trim();
    const subject = document.getElementById("teacherSubject").value.trim();
    if (name && subject) {
      teachers.push({ name, subject });
      renderLists();
      document.getElementById("teacherName").value = "";
      document.getElementById("teacherSubject").value = "";
    }
  }

  function addClass() {
    const name = document.getElementById("className").value.trim();
    const room = document.getElementById("classRoom").value.trim();
    if (name && room) {
      classes.push({ name, room });
      renderLists();
      document.getElementById("className").value = "";
      document.getElementById("classRoom").value = "";
    }
  }

  function deleteStudent(i) {
    students.splice(i, 1);
    renderLists();
  }

  function deleteTeacher(i) {
    teachers.splice(i, 1);
    renderLists();
  }

  function deleteClass(i) {
    classes.splice(i, 1);
    renderLists();
  }

  function clearAll() {
    students = [];
    teachers = [];
    classes = [];
    renderLists();
  }

  renderLists();
</script>

</body>
</html>
